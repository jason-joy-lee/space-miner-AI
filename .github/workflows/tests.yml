name: Python tests
on:
  pull_request:
  push:
    branches: [main, feat/playable-v0-1, feat/playable-v0-4]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - run: python -m compileall -q app.py space_miner webapp tests
      - run: node --check webapp/static/game.js
      - run: python -m pytest -q
